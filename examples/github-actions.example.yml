# .github/workflows/ci-doctor.yml
# Explains failures of your "CI" workflow. Read-only; always exits 0.
name: ci-doctor
on:
  workflow_run:
    workflows: ["CI"]            # the workflow whose failures you want explained
    types: [completed]

jobs:
  explain:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read              # read the failed run, its jobs and their logs
      contents: read
      pull-requests: write       # only needed when post-pr-note is true
    steps:
      - id: doctor
        uses: fennet82/ci-doctor@v1
        # run-id defaults to the run that triggered this one, so on a workflow_run
        # event there is nothing else to wire up.
        with:
          post-pr-note: 'true'
          # Optional LLM (any OpenAI-compatible endpoint) — set these as env instead:
          #   CI_DOCTOR_LLM__MODEL / CI_DOCTOR_LLM__API_BASE

      # The verdict is machine-readable, so you can act on it.
      - if: steps.doctor.outputs.is-infra-not-code == 'true'
        run: echo "::notice::Infrastructure, not the change — a retry may be all it needs."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-doctor-report
          path: |
            report.md
            report.json
