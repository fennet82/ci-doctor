[project]
name = "ci-doctor"
version = "0.1.0"
description = "Postmortem CI failure analyzer: deterministic phase attribution plus one LLM explanation. Read-only, air-gap friendly."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6",
    "python-gitlab>=8.4.0",
]

[project.scripts]
ci-doctor = "ci_doctor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ci_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
