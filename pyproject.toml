[project]
name = "ci-doctorr"
# PEP 440, and the release pipeline owns it — see GUIDELINES.md §8. The `a0` seed is
# the state before the first alpha: `uv version --bump alpha` makes it 0.0.1a1.
version = "0.0.1a4"
description = "Postmortem CI failure analyzer: deterministic phase attribution plus one LLM explanation. Read-only, air-gap friendly."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6",
    "python-gitlab>=8.4.0",
    "openai>=2.48.0",
    "pygithub>=2.9.1",
    "requests>=2.32",  # imported directly to fetch GitHub's job-log redirect
    "httpx>=0.27",  # imported directly for the openai backend's ca_bundle client
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
readme = "README.md"

[project.urls]
Homepage = "https://fennet82.github.io/ci-doctor/"
Repository = "https://github.com/fennet82/ci-doctor"
Issues = "https://github.com/fennet82/ci-doctor/issues"
Changelog = "https://github.com/fennet82/ci-doctor/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# Optional LLM backends (base install stays lean/air-gap-clean). openai is included
# in the base deps; claude_code needs only the `claude` CLI on PATH.
litellm = ["litellm>=1.40"]
# Optional run-memory (E10) vector-store backends, each lazy-imported in memory/backends.py.
pinecone = ["pinecone>=5"]
qdrant = ["qdrant-client>=1.7"]
milvus = ["pymilvus>=2.4"]
weaviate = ["weaviate-client>=4.16"]  # vector_config / Configure.Vectors (older uses deprecated args)
pgvector = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2", "pgvector>=0.3"]
all = [
    "litellm>=1.40",
    "pinecone>=5",
    "qdrant-client>=1.7",
    "pymilvus>=2.4",
    "weaviate-client>=4.16",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
]

[project.scripts]
ci-doctor = "ci_doctor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "ruff>=0.15,<0.16",  # 0.16 widened the DEFAULT rule set; adopting it is its own change
    "ty>=0.0.65,<0.1",  # pre-1.0: pinned so new diagnostics can't redden an unrelated PR
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ci_doctor"]

[tool.ruff]
# 110, not the default 88: the code was written to it (p99 line is 109 chars).
line-length = 110

[tool.ruff.lint]
# S:  flake8-bandit, vendored in ruff — SAST for the shipped package, no second tool.
# D:  the Google docstring convention the repo already writes by hand. Docstrings are
#     this codebase's main onboarding surface (GUIDELINES §6), so they are checked.
# I:  one import order, so a diff never argues about it.
# UP: the floor is 3.11; don't ship idioms written for older ones.
# B, C4: bugbear's real traps, and comprehension literals.
# ANN: every parameter and return in the shipped package is annotated. `ty` only
#      checks what it is given, so an unannotated argument is a hole it reads as
#      Unknown and silently stops checking through.
extend-select = ["S", "D", "I", "UP", "B", "C4", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# ANN off for tests: a test function returns None and says so by being a test.
# `support.py` and `conftest.py` are annotated anyway — they are shared code.
"tests/**" = ["S101", "S603", "ANN"]  # assert is the test; subprocess there is fixture setup
"e2e/**" = ["S101", "S603", "ANN"]  # opt-in e2e suite: assert is the test, same as tests/
"ci_doctor/cli.py" = ["B008"]  # typer declares options as call-valued defaults, by design

[tool.pytest.ini_options]
testpaths = ["tests"]

# Opt-in via `--cov` rather than addopts: measuring triples the suite's wall time.
# CI always passes the flag, so the floor below is enforced on every push.
[tool.coverage.run]
source = ["ci_doctor"]
branch = true

[tool.coverage.report]
# A floor, not a target: raise it when a real gap closes, never lower it to go green.
fail_under = 84
show_missing = true

# No [tool.semantic_release]: python-semantic-release is SemVer-only and cannot express
# a PEP 440 alpha — it reads `0.0.1a1` as unparseable and writes `0.0.1-a.2`. The
# pipeline bumps with `uv version` instead (GUIDELINES.md §8).
