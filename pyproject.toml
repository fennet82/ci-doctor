[project]
name = "ci-doctorr"
version = "2.0.1"
description = "Postmortem CI failure analyzer: deterministic phase attribution plus one LLM explanation. Read-only, air-gap friendly."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6",
    "python-gitlab>=8.4.0",
    "openai>=2.48.0",
    "pygithub>=2.9.1",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
readme = "README.md"

[project.urls]
Homepage = "https://fennet82.github.io/ci-doctor/"
Repository = "https://github.com/fennet82/ci-doctor"
Issues = "https://github.com/fennet82/ci-doctor/issues"
Changelog = "https://github.com/fennet82/ci-doctor/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# Optional LLM backends (base install stays lean/air-gap-clean). openai is included
# in the base deps; claude_code needs only the `claude` CLI on PATH.
litellm = ["litellm>=1.40"]
all = ["litellm>=1.40"]

[project.scripts]
ci-doctor = "ci_doctor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.15,<0.16",  # 0.16 widened the DEFAULT rule set; adopting it is its own change
    # ty is pre-1.0, so its diagnostics still move between releases. Pinned below 0.1
    # for the same reason ruff is pinned below 0.16: a checker that quietly grows new
    # rules turns an unrelated PR red. Bumping it is its own change.
    "ty>=0.0.65,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ci_doctor"]

[tool.ruff]
# 110, not the default 88: the code was written to it (p99 line is 109 chars), and
# forcing the long single-line `return Attribution(...)` calls onto five lines each
# costs more readability than it buys.
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is opt-in per run (`--cov`) rather than in addopts: it triples the suite's
# wall time, and the local loop is meant to stay under five seconds. CI always passes
# the flag, so the floor below is enforced on every push regardless.
[tool.coverage.run]
source = ["ci_doctor"]
branch = true

[tool.coverage.report]
# The floor, not a target. Set to where the suite already stood so it catches a
# regression instead of blessing one; raise it when a real gap gets closed, and
# never lower it to make a red build green.
fail_under = 84
show_missing = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "python -m pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.master]
match = "master"
