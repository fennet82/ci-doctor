[project]
name = "ci-doctorr"
version = "1.1.1"
description = "Postmortem CI failure analyzer: deterministic phase attribution plus one LLM explanation. Read-only, air-gap friendly."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6",
    "python-gitlab>=8.4.0",
    "openai>=2.48.0",
    "pygithub>=2.9.1",
]

[project.optional-dependencies]
# Optional LLM backends (base install stays lean/air-gap-clean). openai is included
# in the base deps; claude_code needs only the `claude` CLI on PATH.
litellm = ["litellm>=1.40"]
anthropic = ["anthropic>=0.40"]
all = ["litellm>=1.40", "anthropic>=0.40"]

[project.scripts]
ci-doctor = "ci_doctor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15,<0.16",  # 0.16 widened the DEFAULT rule set; adopting it is its own change
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ci_doctor"]

[tool.ruff]
# 110, not the default 88: the code was written to it (p99 line is 109 chars), and
# forcing the long single-line `return Attribution(...)` calls onto five lines each
# costs more readability than it buys.
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "python -m pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.master]
match = "master"
