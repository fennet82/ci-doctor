# The contributor's bench: every binary the hooks, tests and release pipeline expect,
# at the versions CI uses. Not a runtime dependency — the shipped package needs only
# Python and its wheels.

[tools]
# Python and ruff are deliberately absent: uv installs Python from `requires-python`
# and uv.lock pins ruff, so `uv run` is the same binary here and in CI. A second copy
# on PATH is how local and CI end up disagreeing about what "formatted" means.
uv = "latest"        # the package manager, the Python it runs on, and the pinned ruff
gitleaks = "latest"  # secret scanning; the pre-push hook and the `leaks` CI job
gh = "latest"        # GitHub CLI — release.yml uploads assets with it
glab = "latest"      # GitLab CLI — the other provider ci-doctor reads
node = "latest"      # the runtime the npm backend below needs

# Indexes this repo into .codegraph/ so agents look up a symbol instead of grepping.
# A tool rather than a task, so `mise install` pins its version like everything else.
"npm:@colbymchenry/codegraph" = "latest"

[tasks.setup]
description = "One-time: install deps and switch git to the repo's hooks"
run = [
  "uv sync",
  "git config core.hooksPath .githooks",
  # So `git blame` skips the one repo-wide reformat.
  "git config blame.ignoreRevsFile .git-blame-ignore-revs",
  "echo 'ready — hooks active, run `mise run check` before pushing'",
]

[tasks.test]
description = "Run the test suite (no network, no LLM)"
run = "uv run pytest -q"

[tasks.cov]
description = "Run the suite with coverage, against the floor CI enforces"
run = "uv run pytest -q --cov"

# UV_PROJECT_ENVIRONMENT gives each version its own cached .venv-3.x; without it
# `uv run --python 3.11` rebuilds the default .venv and leaves you on whichever
# version ran last. Versions are pinned to ci.yml by tests/test_python_versions.py.
[tasks."test:matrix"]
description = "Run the suite on every supported Python (3.11-3.14), like CI"
run = '''
fail=0
for v in 3.11 3.12 3.13 3.14; do
  echo "--- python $v"
  UV_PROJECT_ENVIRONMENT=".venv-$v" uv run --python "$v" pytest -q || fail=1
done
[ $fail -eq 0 ] || echo "test:matrix: at least one version failed" >&2
exit $fail
'''

[tasks.lint]
description = "Lint and check formatting, Python and markdown"
run = [
  "uv run ruff check ci_doctor tests",
  "uv run ruff format --check ci_doctor tests",
  "uv run ruff format --preview --check $(git ls-files '*.md' ':!:.claude/**')",
  "uv run ty check ci_doctor",
]

[tasks.fmt]
description = "Apply formatting and safe lint fixes"
run = [
  # Fix before format: removing an unused import leaves the blank lines it sat
  # between, and only a formatting pass afterwards collapses them.
  "uv run ruff check --fix ci_doctor tests",
  "uv run ruff format ci_doctor tests",
  "uv run ruff format --preview $(git ls-files '*.md' ':!:.claude/**')",
]

[tasks.leaks]
description = "Scan history for secrets, same as the CI job"
run = "gitleaks git --no-banner --redact"

[tasks.check]
description = "Everything CI runs, in one command"
depends = ["test", "lint", "leaks"]

# cleanup: delete rebuildable local junk (keeps .venv, node_modules, .codegraph)
[tasks.cleanup]
description = "Delete rebuildable local junk (keeps .venv, node_modules, .codegraph)"
run = '''
set -u
cd "$(git rev-parse --show-toplevel)" || exit 1
before=$(du -sm . | cut -f1)

# Not `rm -rf **/__pycache__/`: mise runs tasks with sh, which has no globstar, so
# `**` collapses to `*` and silently misses every nested one.
find ci_doctor tests scripts -type d -name __pycache__ -exec rm -rf {} +
rm -rf .pytest_cache .ruff_cache

# Coverage, build output, and ci-doctor's own run artifacts.
rm -rf .coverage .coverage.* htmlcov build dist ./*.egg-info
rm -rf docs/site/dist docs/site/.astro
rm -f report.md report.json

# The per-version venvs from `test:matrix`. The default .venv is deliberately kept.
rm -rf .venv-*/

echo "cleanup: freed $((before - $(du -sm . | cut -f1))) MB"
echo "kept: .venv, docs/site/node_modules, .codegraph, and your own untracked files"
'''

[tasks.schema]
description = "Emit the .ci-doctor.yml JSON Schema (what the release attaches)"
run = "uv run ci-doctor config --schema"

[tasks."docs:data"]
description = "Regenerate the docs matcher catalogue from defaults.yml"
run = "uv run python scripts/gen_docs_data.py"

# The site is served from /ci-doctor, so the dev URL carries the base too.
[tasks.docs]
description = "Preview the docs site at http://localhost:4321/ci-doctor"
dir = "docs/site"
run = ["npm install", "npm run dev"]

[tasks."docs:build"]
description = "Build the docs site, same as the CI job"
dir = "docs/site"
run = ["npm ci", "npm run build"]

# Search needs the index the build generates, and `astro dev` has none. Serving a
# copy of it does not help either — the runtime stalls against the dev server —
# so building and previewing is the way to exercise search locally.
[tasks."docs:preview"]
description = "Build the docs site and serve the built output (the only mode where search works)"
dir = "docs/site"
run = ["npm run build", "npm run preview"]

