name: ci

# Every pull request targeting master, and master itself so a direct push is not a
# blind spot. Jobs are independent on purpose: one red check should tell you which
# kind of problem you have without re-reading the log.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # pyproject claims 3.11–3.14 in requires-python and the classifiers. Testing one
    # version would make that a claim nobody checks — a 3.11 syntax error would ship.
    strategy:
      fail-fast: false   # knowing it breaks on 3.11 *and* 3.14 is worth the minutes
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # No network and no LLM by design — tests/conftest.py blocks real sockets.
      # --cov enforces the floor in [tool.coverage.report]; it is off locally because
      # it triples the runtime, so this job is where the gate actually bites.
      # A failing test also annotates the diff inline, via the
      # pytest-github-actions-annotate-failures dev dependency — it emits GitHub's
      # ::error workflow commands and stays silent anywhere else, so no step here.
      - run: uv run pytest -q --cov
      # GitHub's answer to GitLab's report artifacts: $GITHUB_STEP_SUMMARY is markdown
      # rendered on the run page, per job. Native, so no third-party action and no
      # account. always() because the coverage of a red run is exactly when you want
      # it; --fail-under=0 because pytest already gated above and a second failure
      # here would only obscure which check actually broke. `|| true` for the same
      # reason: with no data coverage writes its own "No data to report." into the
      # summary, which is the whole message — it should not also redden the step.
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY" || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check ci_doctor tests
      - name: ruff format
        run: uv run ruff format --check ci_doctor tests
      # Markdown formatting is preview-only, and scoped to *.md so Python stays on
      # ruff's stable rules. It reformats Python blocks inside docs, not prose.
      - name: ruff format (markdown code blocks)
        run: uv run ruff format --preview --check $(git ls-files '*.md' ':!:.claude/**')
      # ci_doctor only, not tests/: the shipped package is what a type error can
      # actually break for a user. Tests are free to be loose about types.
      - name: ty
        run: uv run ty check ci_doctor

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      # Build only. Publishing is docs.yml, which runs on master alone — a PR
      # proves the site compiles without being able to touch what is live.
      - run: npm run build

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Invariant #2: core/ must not know a provider exists. A grep is the whole
      # test — if it matches, the ports/adapters split has been broken.
      - name: No provider identifiers in core/
        run: |
          if grep -rniE 'gitlab|github' ci_doctor/core/; then
            echo "::error::core/ must not reference a provider (GUIDELINES.md invariant #2)"
            exit 1
          fi

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the PR's whole history, not just the tip
      # .gitleaks.toml scopes one allowlist to the redaction tests, which plant fake
      # tokens on purpose. Passed explicitly rather than relying on auto-discovery.
      # Note: gitleaks-action is free for personal and public repos; moving this
      # repo under an organisation would require GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
