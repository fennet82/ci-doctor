name: ci

# Jobs are independent on purpose: one red check should name the kind of problem.
#
# Runs on both hops of the flow — <type>/<slug> -> development -> master — and on
# pushes to either, so a merge that skipped a PR is still checked. The heavier
# release-readiness checks live in release-gate.yml, on the master PR only.
on:
  pull_request:
    branches: [development, master]
  push:
    branches: [development, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The git hooks check both of these locally, and `--no-verify` skips them. The
  # release gate reads commit types to decide whether to ship, so they are worth
  # asserting somewhere that cannot be bypassed.
  conventions:
    # Feature work only. The development -> master PR is an integration, not a
    # feature branch, and carries no type prefix.
    if: github.event_name == 'pull_request' && github.base_ref == 'development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the PR's own commits, not just its tip
      - name: Branch name is <type>/<slug>
        env:
          BRANCH: ${{ github.head_ref }}   # via env, never interpolated into the script
        run: |
          types='feat|fix|docs|test|chore|refactor|perf|ci|build|style|revert'
          if [[ ! "$BRANCH" =~ ^($types)/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "::error::branch '$BRANCH' is not <type>/<slug>. Types: ${types//|/, }"
            exit 1
          fi
          echo "branch '$BRANCH' ok"
      - name: Commits are Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          types='feat|fix|docs|test|chore|refactor|perf|ci|build|style|revert'
          bad=0
          while IFS= read -r subject; do
            # Merge and revert commits are generated, not authored.
            [[ "$subject" =~ ^(Merge|Revert) ]] && continue
            if [[ ! "$subject" =~ ^($types)(\(.+\))?!?:\ .+ ]]; then
              echo "::error::not a Conventional Commit: $subject"
              bad=1
            fi
          done < <(git log --format=%s "$BASE..$HEAD")
          [[ $bad -eq 0 ]] && echo "every commit subject ok"
          exit $bad

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # which versions break is the useful answer, not just that one did
      matrix:
        # Kept in step with the pyproject classifiers by tests/test_python_versions.py.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # Failures annotate the diff inline: the pytest-github-actions-annotate-failures
      # dev dependency emits GitHub's ::error commands, so there is no step for it here.
      - run: uv run pytest -q --cov
      # $GITHUB_STEP_SUMMARY is markdown rendered on the run page — GitHub's answer to
      # GitLab's report artifacts. Informational only: pytest already gated the floor.
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY" || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check ci_doctor tests
      - name: ruff format
        run: uv run ruff format --check ci_doctor tests
      # --preview is scoped to *.md so Python stays on ruff's stable rules. It
      # reformats Python blocks inside docs, not prose.
      - name: ruff format (markdown code blocks)
        run: uv run ruff format --preview --check $(git ls-files '*.md' ':!:.claude/**')
      # ci_doctor only: a type error in the shipped package is what reaches a user.
      - name: ty
        run: uv run ty check ci_doctor

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      # Build only — publishing is docs.yml, so a PR cannot touch what is live.
      - run: npm run build

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the PR's whole history, not just the tip
      # gitleaks-action is free for personal and public repos; moving this repo under
      # an organisation would require GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
