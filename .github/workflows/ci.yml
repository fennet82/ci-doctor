name: ci

# Jobs are independent on purpose: one red check should name the kind of problem.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # which versions break is the useful answer, not just that one did
      matrix:
        # Kept in step with the pyproject classifiers by tests/test_python_versions.py.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # Failures annotate the diff inline: the pytest-github-actions-annotate-failures
      # dev dependency emits GitHub's ::error commands, so there is no step for it here.
      - run: uv run pytest -q --cov
      # $GITHUB_STEP_SUMMARY is markdown rendered on the run page — GitHub's answer to
      # GitLab's report artifacts. Informational only: pytest already gated the floor.
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY" || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check ci_doctor tests
      - name: ruff format
        run: uv run ruff format --check ci_doctor tests
      # --preview is scoped to *.md so Python stays on ruff's stable rules. It
      # reformats Python blocks inside docs, not prose.
      - name: ruff format (markdown code blocks)
        run: uv run ruff format --preview --check $(git ls-files '*.md' ':!:.claude/**')
      # ci_doctor only: a type error in the shipped package is what reaches a user.
      - name: ty
        run: uv run ty check ci_doctor

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      # Build only — publishing is docs.yml, so a PR cannot touch what is live.
      - run: npm run build

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the PR's whole history, not just the tip
      # gitleaks-action is free for personal and public repos; moving this repo under
      # an organisation would require GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
