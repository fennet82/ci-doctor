# Shipped baseline config.
#
# Scalar defaults live in schema.py; this file carries the data-heavy baseline
# (phase map, starter matchers, noise patterns) that is awkward to express as
# Python defaults. Layer order (lowest -> highest precedence):
#   schema defaults  <  this file  <  repo .ci-doctor.yml  <  CI_DOCTOR_* env  <  CLI flags
# List values REPLACE across layers; mappings deep-merge.

# GitLab section name -> phase. Users add their own custom sections under `phases:`
# in the repo config (deep-merged onto this map).
phases:
  resolve_secrets: prepare
  prepare_executor: prepare
  prepare_script: prepare
  get_sources: fetch
  restore_cache: fetch
  download_artifacts: fetch
  step_script: script
  after_script: post
  archive_cache: post
  archive_cache_on_failure: post
  upload_artifacts_on_success: post
  upload_artifacts_on_failure: post
  cleanup_file_variables: post
  # GitHub Actions canonical section names (emitted by the GitHub segmenter).
  setup_job: prepare
  setup: prepare
  checkout: fetch
  run: script
  post: post
  complete_job: post

extraction:
  # Anchored matchers, highest priority survives budget pressure. `start`/`end`
  # capture a block; `pattern` captures a single line plus before/after context.
  matchers:
    - id: pytest
      start: '^=+ FAILURES =+'
      end: '^=+ short test summary'
      priority: 90
    - id: jest
      start: '^\s*●|^FAIL '
      end: '^Tests:'
      priority: 90
    - id: go_test
      pattern: '^--- FAIL'
      before: 2
      after: 15
      priority: 85
    - id: maven_gradle
      pattern: '\[ERROR\]|FAILURE: Build failed|BUILD FAILURE'
      before: 3
      after: 15
      priority: 80
    - id: tsc
      pattern: 'error TS\d+:'
      before: 1
      after: 3
      priority: 80
    - id: npm
      pattern: 'npm ERR!'
      before: 2
      after: 10
      priority: 75
    - id: docker_build
      pattern: 'failed to solve|executor failed running'
      before: 3
      after: 8
      priority: 75
    - id: oom
      pattern: 'exit code 137|Killed|Out of memory'
      before: 5
      after: 2
      priority: 95
    - id: generic_error
      pattern: '^(ERROR|FATAL)\b'
      before: 5
      after: 20
      priority: 50

denoise:
  noise_patterns:
    - '^\s*$'
