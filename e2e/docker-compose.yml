# Local vector stores for the opt-in e2e suite (tests/e2e is deliberately outside the
# offline `tests/` tree, whose conftest blocks all sockets). Boot with
# `mise run test:e2e`, which starts these, runs e2e/, and tears them down.
#
# Pinecone is intentionally absent: it is a managed cloud service with no local image,
# so it cannot be exercised here — it stays covered by the offline dispatch tests and a
# manual cloud smoke test only.
name: ci-doctor-vector-e2e

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.13
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080" # HTTP
      - "50051:50051" # gRPC
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      QUERY_DEFAULTS_LIMIT: "25"

  pgvector:
    image: pgvector/pgvector:pg17 # pgvector has no `latest` tag; pinned to the newest pg major
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ci_doctor
      POSTGRES_PASSWORD: ci_doctor
      POSTGRES_DB: ci_doctor

  # Milvus standalone needs etcd + object storage (minio) alongside it.
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16 # no `latest` tag on quay; milvus plumbing, pinned
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd

  milvus-minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z # milvus plumbing, pinned to a known-good release
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

  milvus:
    image: milvusdb/milvus:v3.0.1
    command: ["milvus", "run", "standalone"]
    depends_on:
      - milvus-etcd
      - milvus-minio
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530" # gRPC/SDK
      - "9091:9091" # health/metrics
